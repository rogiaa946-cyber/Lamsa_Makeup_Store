<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LAMSA</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Tajawal',sans-serif;
            background:#fffaf9;
        }

        .accent-bg{
            background:#b48c82;
        }

        .accent-bg:hover{
            background:#9d766d;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

<div class="bg-white w-full max-w-md rounded-3xl shadow-xl p-8">

    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold italic text-[#4a3733]">
            LAMSA
        </h1>

        <p class="text-gray-500 mt-2">
            Create your account ✨
        </p>
    </div>

    <form method="POST">

        {% csrf_token %}

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-xl
                    {% if message.tags == 'error' %}
                        bg-red-100 text-red-700 border border-red-300
                    {% elif message.tags == 'success' %}
                        bg-green-100 text-green-700 border border-green-300
                    {% else %}
                        bg-gray-100 text-gray-700 border border-gray-300
                    {% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="mb-4">
            <label class="block mb-2 font-semibold">Username</label>
            <input
                type="text"
                name="username"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#b48c82]"
                placeholder="Enter your username">
        </div>

        <div class="mb-4">
            <label class="block mb-2 font-semibold">Email</label>
            <input
                type="email"
                name="email"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#b48c82]"
                placeholder="Enter your email">
        </div>

        <div class="mb-6">
            <label class="block mb-2 font-semibold">Password</label>
            <input
                type="password"
                name="password"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#b48c82]"
                placeholder="Enter your password">
        </div>

        <button
            type="submit"
            class="accent-bg w-full text-white font-bold py-3 rounded-xl transition">
            Create Account
        </button>

    </form>

    <p class="text-center mt-6 text-gray-600">
        Already have an account?

        <a href="{% url 'login' %}"
           class="font-bold text-[#b48c82]">
            Login
        </a>
    </p>

    <div class="text-center mt-4">
        <a href="/"
           class="text-sm text-gray-500 hover:text-[#b48c82]">
            ← Back to Home
        </a>
    </div>

</div>

</body>
</html>
