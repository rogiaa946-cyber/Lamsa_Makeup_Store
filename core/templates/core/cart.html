<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Lamsa Beauty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fffaf9; }
        .header-bg { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #f3e8e6; }
        .accent-bg { background-color: #b48c82; }
        .text-luxury { color: #4a3733; }
    </style>
</head>
<body class="antialiased">

    <header class="header-bg sticky top-0 z-20">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-extrabold text-luxury tracking-tighter italic cursor-pointer">
                <a href="/">LAMSA</a>
            </h1>
            <a href="/" class="text-sm font-bold text-amber-700 hover:underline">Continue Shopping</a>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-12 max-w-2xl">
        <h2 class="text-3xl font-bold text-luxury mb-8">Your Shopping Cart</h2>
        
        <div class="bg-white border border-rose-100 rounded-2xl p-6 shadow-sm">
            {% for item in cart.items.all %}
            <div class="flex justify-between items-center py-4 border-b border-rose-50 last:border-0">
                <div>
                    <h3 class="font-bold text-luxury text-lg">{{ item.product.name }}</h3>
                    <p class="text-gray-400 text-sm">Quantity: {{ item.quantity }}</p>
                </div>
                <span class="font-bold text-luxury text-lg">{{ item.product.price }} SDG</span>
            </div>
            {% empty %}
            <div class="text-center py-8">
                <p class="text-gray-400">Your cart is empty.</p>
            </div>
            {% endfor %}
            
            {% if cart.items.all %}
            <div class="mt-6 pt-6 border-t border-gray-100 flex justify-between items-center">
                <span class="text-xl font-bold text-luxury">Total:</span>
                <span class="text-2xl font-extrabold text-amber-700">{{ total_price }} SDG</span>
            </div>
            <div class="mt-8">
                <button class="w-full accent-bg text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:opacity-90 transition">
                    <a href="{% url 'checkout' %}" class="w-full block text-center accent-bg text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:opacity-90 transition">
                          Proceed to Checkout
                    </a>
                </button>
            </div>
            {% endif %}
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
